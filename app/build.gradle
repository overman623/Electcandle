plugins {
    id 'com.android.application'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def storeFilePath = localProps.getProperty("release.storeFile")
def hasReleaseSigning = storeFilePath != null && !storeFilePath.trim().isEmpty()

android {
    namespace 'com.happyhouse.electcandle'
    compileSdk 36

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(storeFilePath)
                storePassword localProps.getProperty("release.storePassword")
                keyAlias localProps.getProperty("release.keyAlias")
                keyPassword localProps.getProperty("release.keyPassword")
            }
        }
    }

    defaultConfig {
        applicationId "com.happyhouse.electcandle"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 9
        versionName "1.0.5"
    }
    buildTypes {
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.gms:play-services-ads:24.5.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
